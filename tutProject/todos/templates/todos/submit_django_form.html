<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Details</title>
    <style>
        :root {
            color: #172033;
            background: #eef3f7;
            font-family: Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(100%, 460px);
            background: #ffffff;
            border: 1px solid #d6dee7;
            border-radius: 8px;
            box-shadow: 0 12px 28px rgba(23, 32, 51, 0.12);
            padding: 32px;
        }

        h1 {
            margin: 0 0 8px;
            color: #12375b;
            font-size: 28px;
        }

        .intro {
            margin: 0 0 28px;
            color: #526275;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #26364a;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 44px;
            border: 1px solid #aebdcb;
            border-radius: 5px;
            padding: 10px 12px;
            color: #172033;
            font: inherit;
        }

        input:focus {
            outline: 3px solid #a9d5f5;
            border-color: #1b6ca8;
        }

        button {
            width: 100%;
            min-height: 44px;
            border: 0;
            border-radius: 5px;
            background: #146c94;
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button:hover {
            background: #0e5271;
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            body {
                padding: 16px;
            }

            main {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Submit Your Details</h1>
        <p class="intro">Share a few details to complete your submission.</p>

        <form method="post" action="{% url 'postend' %}">
            {% csrf_token %}
            {{form.as_p}}
            <button type="submit">Send POST</button>
        </form>
    </main>
</body>
</html>
